name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Windows / .NET 10
    runs-on: windows-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: .NET 10 einrichten
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Abhängigkeiten wiederherstellen
        run: dotnet restore .\NexusControlAgent.csproj

      - name: Agent erstellen
        run: dotnet build .\NexusControlAgent.csproj --configuration Release --no-restore --nologo -p:ContinuousIntegrationBuild=true
